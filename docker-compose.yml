services:
  mysql:
    image: mysql:8.0
    container_name: sabitech_mysql
    restart: always
    environment:
      MYSQL_DATABASE: sabitech_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: sabitech_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
